[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rydberg-research-code"
version = "0.1.0"
description = "Original research code for three Rydberg-atom quantum optics papers (PRA 108 043713, PRL 133 213601, PRA 97 043401)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed by interference_bunching/, superatom_dipole_moment/, and misc/.
legacy = ["pandas>=2.0", "numba>=0.58", "ARC-Alkali-Rydberg-Calculator>=3.0"]
